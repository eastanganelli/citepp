name: build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            preset: windows-mingw
          - os: ubuntu-latest
            preset: default
          - os: macos-latest
            preset: default
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # ---- Frontend: React -> frontend/dist ----
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # ---- Toolchain: Ninja everywhere; MinGW on Windows ----
      - name: Install MinGW + Ninja (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      # ---- C++ build ----
      - name: Configure & build (Windows/MSYS2)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cmake --preset ${{ matrix.preset }}
          cmake --build build

      - name: Configure & build (Unix)
        if: runner.os != 'Windows'
        run: |
          cmake --preset ${{ matrix.preset }}
          cmake --build build

      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.os }}
          path: |
            build/app*
            build/ui
